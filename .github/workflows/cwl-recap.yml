name: CWL recap mail

on:
  schedule:
    # Daily during the part of the month when CWL ends. cwl_mail.py --send
    # only mails a finished season, once (recorded in api/cwl/recaps_sent.json)
    - cron: "0 9 5-20 * *"
  workflow_dispatch:
    inputs:
      resend:
        description: "Send again even if this season's recap already went out"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cwl-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        run: python -m pytest api/ -q

      - name: Send CWL recap
        env:
          api_key: ${{ secrets.api_key }}
          coc_base_url: ${{ secrets.coc_base_url }}
          smtp_password: ${{ secrets.smtp_password }}
          mail_subscribers: ${{ secrets.mail_subscribers }}
          publish_data: "true"
          PYTHONIOENCODING: utf-8
        run: python api/cwl_mail.py --send ${{ inputs.resend && '--resend' || '' }}

      # Also after a partial send failure, so the next run doesn't mail everyone again
      - name: Record sent recap
        if: always()
        run: |
          if [ ! -f api/cwl/recaps_sent.json ] || { git ls-files --error-unmatch api/cwl/recaps_sent.json >/dev/null 2>&1 && git diff --quiet -- api/cwl/recaps_sent.json; }; then
            echo "No recap sent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/cwl/recaps_sent.json
          git commit -m "chore: record CWL recap mail"
          # The 6-hourly data job may have pushed meanwhile; it never touches this file
          git pull --rebase
          git push
