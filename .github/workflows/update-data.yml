name: Update clan data

on:
  schedule:
    # Every 6 hours, so every war's battle day is seen at least once before
    # the next war starts. Repeat runs during a war just refresh its attacks.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Right after the Monday ranked snapshot, so the Players tab and "Zwegers of
  # the Week" show the new week within minutes instead of at the next 6h run
  workflow_run:
    workflows: ["Weekly ranked snapshot and mail"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  DATA_FILES: >-
    coc-dashboard/public/clan_data.json
    api/clan_history.json
    mobile-coc-dashboard/assets/data/clan_data.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        run: python -m pytest api/ -q

      - name: Run scraper
        env:
          api_key: ${{ secrets.api_key }}
          coc_base_url: ${{ secrets.coc_base_url }}
          publish_data: "true"
          PYTHONIOENCODING: utf-8
        run: python api/clan_analyzer.py

      - name: Check max-level tables
        run: python api/check_caps.py coc-dashboard/public/clan_data.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coc-dashboard/package-lock.json

      - name: Check data matches dashboard types
        working-directory: coc-dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Sync mobile app data
        run: cp coc-dashboard/public/clan_data.json mobile-coc-dashboard/assets/data/clan_data.json

      - name: Commit updated data
        run: |
          # Skip the commit when only timestamps changed
          changed=$(git diff -U0 -- $DATA_FILES \
            | grep -E '^[+-][^+-]' \
            | grep -vcE '"(lastUpdated|last_updated|recorded_date)":' || true)
          if [ "$changed" -eq 0 ]; then
            echo "No data changes besides timestamps."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DATA_FILES
          git commit -m "chore: clan data update"
          git push
