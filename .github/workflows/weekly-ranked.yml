name: Weekly ranked snapshot and mail

on:
  schedule:
    # Monday 07:17 UTC: the ranked week starts Monday 05:00 UTC, so last
    # week's results are final and everyone is in their new league. Off the
    # full hour, when GitHub delays scheduled runs the most.
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      send_mails:
        description: "Also send the mails to all subscribers (skipped if this week's already went out)"
        type: boolean
        default: false
      resend:
        description: "Send even if this week's mail already went out"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-ranked
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        run: python -m pytest api/ -q

      - name: Record ranked snapshot
        env:
          api_key: ${{ secrets.api_key }}
          coc_base_url: ${{ secrets.coc_base_url }}
          publish_data: "true"
          PYTHONIOENCODING: utf-8
        run: python api/ranked.py

      - name: Commit snapshot
        run: |
          if git diff --quiet -- api/ranked_snapshots.json && git ls-files --error-unmatch api/ranked_snapshots.json >/dev/null 2>&1; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ranked_snapshots.json
          git commit -m "chore: weekly ranked snapshot"
          # The 6-hourly data job may have pushed meanwhile; it never touches this file
          git pull --rebase
          git push

      # After the commit, so a mail failure never loses the snapshot.
      # Scheduled runs always send; manual runs only when asked. Either way
      # a week is mailed once (api/weekly_mails_sent.json), unless resend.
      - name: Send weekly mails
        id: mails
        if: github.event_name == 'schedule' || inputs.send_mails
        env:
          api_key: ${{ secrets.api_key }}
          coc_base_url: ${{ secrets.coc_base_url }}
          smtp_password: ${{ secrets.smtp_password }}
          mail_subscribers: ${{ secrets.mail_subscribers }}
          publish_data: "true"
          PYTHONIOENCODING: utf-8
        run: python api/weekly_mail.py --send ${{ inputs.resend && '--resend' || '' }}

      # Also after a partial send failure, so a rerun doesn't mail everyone again
      - name: Record sent mails
        if: always() && steps.mails.outcome != 'skipped'
        run: |
          file=api/weekly_mails_sent.json
          if [ ! -f $file ] || { git ls-files --error-unmatch $file >/dev/null 2>&1 && git diff --quiet -- $file; }; then
            echo "No mails sent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $file
          git commit -m "chore: record weekly ranked mail"
          git pull --rebase
          git push
